name: Build and Release Scrcpy Screen Off

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/zwc456baby/ScrcpyForAndroid.git

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Clone upstream ScrcpyForAndroid
        run: git clone --depth 1 --recurse-submodules "$UPSTREAM_REPO" upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Apply screen-off feature
        run: |
          python3 patch_screen_off_v2.py
          python3 patch_screen_off_v3.py
          python3 patch_screen_power_protocol.py

      - name: Create temporary signing key
        working-directory: upstream
        run: |
          keytool -genkeypair -v \
            -keystore app/scrcpy.jks \
            -storepass android \
            -keypass android \
            -alias scrcpy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=scrcpy-for-me, OU=Android, O=mohan7-byte, L=Jodhpur, ST=Rajasthan, C=IN"

      - name: Build signed release APK
        working-directory: upstream
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_ALIAS: scrcpy
          SIGNING_KEY_PASSWORD: android
        run: |
          chmod +x gradlew
          ./gradlew assembleScrcpyRelease --stacktrace -x :server:lintVitalRelease

      - name: Prepare release asset
        run: |
          APK=$(find upstream/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/scrcpy-for-me-screen-off.apk
          sha256sum dist/scrcpy-for-me-screen-off.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-for-me-screen-off
          path: dist/scrcpy-for-me-screen-off.apk
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="screen-off-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            dist/scrcpy-for-me-screen-off.apk \
            --title "Scrcpy For Me - Screen Off ${GITHUB_RUN_NUMBER}" \
            --notes "Dedicated display-power control packet, Android 10 physical-display power mode, upstream-style touch forwarding while the panel is off, and keep-active support."
